name: Release

# Build Carryover on Windows and publish a GitHub Release.
# Either push a tag like v0.1.0, or push to the `release` branch: the version
# then comes from app/src-tauri/tauri.conf.json and the tag is created here.
on:
  push:
    tags: ["v*"]
    branches: [release]

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    env:
      # Signing turns on once the SignPath secret exists (see docs/CODE_SIGNING.md).
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tests
        run: cargo test -p carryover-core

      - name: Real scan check on this runner
        run: cargo run -p carryover-core --example scan_check

      - name: Build installer and app
        working-directory: app
        run: |
          npm ci
          npx tauri build

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v" + (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "Releasing $tag"

      - name: Collect release files
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/carryover.exe "dist/Carryover-$version-portable.exe"
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          Copy-Item $setup.FullName "dist/Carryover_${version}_x64-setup.exe"

      - name: Upload unsigned files for signing
        id: unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: carryover-unsigned
          path: dist/*.exe

      - name: Sign with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'carryover' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed

      - name: Use the signed files
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          Copy-Item dist-signed/*.exe dist/ -Force
          Get-ChildItem dist/*.exe | ForEach-Object { Get-AuthenticodeSignature $_.FullName | Format-List Path, Status, SignerCertificate }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}
          if ($env:SIGNPATH_ENABLED -ne 'true') { "Note: files are unsigned (SignPath not set up yet)." }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { $notes = $null }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Same version built again: replace the files, keep the release.
            gh release upload $tag dist/* --clobber
            exit $LASTEXITCODE
          }
          $global:LASTEXITCODE = 0
          $args = @("release", "create", $tag, "dist/*", "--title", "Carryover $tag", "--target", "${{ github.sha }}")
          if ($notes) { $args += @("--notes-file", $notes) } else { $args += "--generate-notes" }
          if ($tag -match "-") { $args += "--prerelease" }
          & gh @args
