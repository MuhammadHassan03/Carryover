name: Release

# Push a tag like v0.1.0 to build Carryover on Windows and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Tests
        run: cargo test -p carryover-core

      - name: Real scan check on this runner
        run: cargo run -p carryover-core --example scan_check

      - name: Build installer and app
        working-directory: app
        run: |
          npm ci
          npx tauri build

      - name: Collect release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/carryover.exe "dist/Carryover-$version-portable.exe"
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced" }
          Copy-Item $setup.FullName "dist/Carryover_${version}_x64-setup.exe"
          Get-ChildItem dist/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { $notes = $null }
          $args = @("release", "create", $tag, "dist/*", "--title", "Carryover $tag", "--verify-tag")
          if ($notes) { $args += @("--notes-file", $notes) } else { $args += "--generate-notes" }
          if ($tag -match "-") { $args += "--prerelease" }
          & gh @args
