name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (real scan + app build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Core tests
        run: cargo test -p carryover-core

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Real scan of this Windows machine
        run: cargo run -p carryover-core --example scan_check -- recipe.json

      - name: Build the app
        working-directory: app
        run: |
          npm ci
          npm run build
          npx tauri build --no-bundle

      - name: Report size
        shell: pwsh
        run: |
          $exe = Get-Item target/release/carryover.exe
          "carryover.exe: {0:N1} MB" -f ($exe.Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: carryover-windows
          path: |
            target/release/carryover.exe
            recipe.json
